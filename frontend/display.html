<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Selfie Station — Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000000; --fg:#f5f5f7; --accent: oklch(0.82 0.14 210); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
function DisplayApp() {
  const API_BASE = window.location.origin.includes('localhost') 
    ? 'http://localhost:3000'
    : 'https://api.yourbranding.com';

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session');

  const [state, setState] = React.useState({ photo: null, signatures: [], expiresIn: 300 });
  const [error, setError] = React.useState(null);

  React.useEffect(() => {
    if (!sessionId) { setError('Invalid session'); return; }
    const poll = async () => {
      try {
        const res = await fetch(`${API_BASE}/api/session/${sessionId}`);
        if (!res.ok) {
          if (res.status === 404) { setError('Session expired or not found'); return; }
          throw new Error('Poll failed');
        }
        const data = await res.json();
        setState({
          photo: data.photo?.data || null,
          signatures: data.signatures || [],
          expiresIn: data.expiresIn || 0,
        });
      } catch (e) {
        console.error('Poll error:', e);
      }
    };
    poll();
    const interval = setInterval(poll, 500);
    return () => clearInterval(interval);
  }, [sessionId, API_BASE]);

  return (
    <div style={{ position:'fixed', inset:0, background:'#000', overflow:'hidden' }}>
      {error ? (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', flexDirection:'column', gap:20, color:'#f5f5f7' }}>
          <h1>{error}</h1>
          <button onClick={() => window.location.reload()} style={{
            padding:'10px 20px', background:'var(--accent)', color:'#000', borderRadius:8, border:'none', cursor:'pointer'
          }}>Reload</button>
        </div>
      ) : (
        <>
          {/* Full-bleed photo */}
          {state.photo ? (
            <img src={state.photo} alt="" style={{
              position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', display:'block'
            }} />
          ) : (
            <div style={{
              position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
              backgroundImage:`repeating-linear-gradient(45deg, #0a0a0b 0 14px, #0e0e12 14px 28px)`,
              color:'rgba(245,245,247,0.6)', flexDirection:'column', gap:20,
            }}>
              <div style={{ width:80, height:80, borderRadius:'50%', border:'1.5px dashed var(--accent)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <div style={{ width:14, height:14, borderRadius:'50%', background:'var(--accent)' }}/>
              </div>
              <span className="mono" style={{ fontSize:13, letterSpacing:2 }}>AWAITING PHOTO</span>
            </div>
          )}

          {/* Darkening overlay */}
          <div style={{
            position:'absolute', inset:0, pointerEvents:'none',
            background:'linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.55) 100%)',
          }}/>

          {/* Drifting signatures */}
          <SignatureField signatures={state.signatures} />

          {/* Bottom bar */}
          <div style={{
            position:'fixed', bottom:0, left:0, right:0,
            padding:'10px 3% 12px',
            display:'flex', alignItems:'center', justifyContent:'space-between', gap:16,
            background:'linear-gradient(to top, rgba(0,0,0,0.75), transparent)',
            fontFamily:'JetBrains Mono, monospace', fontSize:12, letterSpacing:1.4,
            textTransform:'uppercase', color:'rgba(245,245,247,0.5)', zIndex:5,
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:7, height:7, borderRadius:'50%', background:'var(--accent)', boxShadow:`0 0 10px var(--accent)`, animation:'pulse 1.8s ease-in-out infinite' }} />
              <span>SES {sessionId}</span>
            </div>
            <div style={{ flex:1, textAlign:'center', opacity:0.55 }}>
              No data stored · Auto-wipe on session end
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <span>{state.signatures.length} sig{state.signatures.length===1?'':'s'}</span>
              <span style={{ color: state.expiresIn < 60 ? 'var(--danger)' : 'rgba(245,245,247,0.7)' }}>
                {String(Math.floor(state.expiresIn/60)).padStart(2,'0')}:{String(state.expiresIn%60).padStart(2,'0')}
              </span>
              <div style={{ width:60, height:3, background:'rgba(255,255,255,0.1)', borderRadius:2, overflow:'hidden' }}>
                <div style={{
                  width:`${Math.max(0, Math.min(1, state.expiresIn / 300)) * 100}%`,
                  height:'100%',
                  background: state.expiresIn < 60 ? 'var(--danger)' : 'var(--accent)',
                  transition:'width .5s linear'
                }} />
              </div>
            </div>
          </div>

          <style>{`
            @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
            @keyframes sigFadeIn { from { opacity:0; filter: blur(8px); } to { opacity:1; filter: blur(0); } }
          `}</style>
        </>
      )}
    </div>
  );
}

function SignatureField({ signatures }) {
  const containerRef = React.useRef(null);
  return (
    <div ref={containerRef} style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:2, overflow:'hidden' }}>
      {signatures.map((sig, i) => (
        <DriftingSignature key={sig.id} sig={sig} index={i} containerRef={containerRef} />
      ))}
    </div>
  );
}

function DriftingSignature({ sig, index, containerRef }) {
  const nodeRef = React.useRef(null);
  const seed = React.useMemo(() => {
    const rnd = (n) => {
      let h = (sig.id % 100000) + n * 2654435761 + index * 97;
      h = Math.imul(h ^ (h >>> 15), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return ((h >>> 0) % 1000) / 1000;
    };
    const widthPct = 28;
    return {
      startX: 15 + rnd(1) * 70,
      startY: 15 + rnd(2) * 70,
      vx: (rnd(3) - 0.5) * 0.06,
      vy: (rnd(4) - 0.5) * 0.06,
      rot: (rnd(5) - 0.5) * 14,
      rotWobble: (rnd(6) - 0.5) * 0.04,
      scale: 0.85 + rnd(7) * 0.35,
      widthPct,
    };
  }, [sig.id, index]);

  React.useEffect(() => {
    const node = nodeRef.current;
    const container = containerRef.current;
    if (!node || !container) return;

    let x = seed.startX, y = seed.startY;
    let vx = seed.vx, vy = seed.vy;
    let rot = seed.rot;
    const baseRot = seed.rot;
    let wobbleT = 0;
    let running = true;
    let raf;

    const tick = () => {
      if (!running) return;
      x += vx; y += vy;
      const margin = seed.widthPct / 2 + 3;
      if (x < margin) { x = margin; vx = Math.abs(vx); }
      else if (x > 100 - margin) { x = 100 - margin; vx = -Math.abs(vx); }
      if (y < 12) { y = 12; vy = Math.abs(vy); }
      else if (y > 88) { y = 88; vy = -Math.abs(vy); }

      wobbleT += 0.01;
      const wobble = Math.sin(wobbleT + index) * 6;
      rot = baseRot + wobble;

      node.style.transform = `translate(-50%,-50%) rotate(${rot.toFixed(2)}deg) scale(${seed.scale})`;
      node.style.left = x.toFixed(3) + '%';
      node.style.top = y.toFixed(3) + '%';
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { running = false; cancelAnimationFrame(raf); };
  }, [seed, index, containerRef]);

  return (
    <div
      ref={nodeRef}
      style={{
        position:'absolute',
        left:`${seed.startX}%`,
        top:`${seed.startY}%`,
        width:`${seed.widthPct}%`,
        transform:`translate(-50%,-50%) rotate(${seed.rot}deg) scale(${seed.scale})`,
        willChange:'transform, left, top',
        animation:`sigFadeIn 1.1s cubic-bezier(.2,.8,.2,1) both`,
      }}
    >
      <svg viewBox={`0 0 ${sig.width} ${sig.height}`} width="100%" style={{
        display:'block',
        filter:`drop-shadow(0 2px 8px rgba(0,0,0,0.85)) drop-shadow(0 0 16px var(--accent)60)`,
      }}>
        <path d={sig.d} stroke="#fff" strokeWidth="4.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
      <div style={{
        height:1, background:`linear-gradient(90deg, transparent, var(--accent), transparent)`,
        marginTop:4,
      }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DisplayApp/>);
</script>
</body>
</html>
